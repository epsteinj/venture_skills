[project]
name = "cold-email-skill"
version = "0.1.0"
description = "Cold outbound email skill: find Specter leads, check Affinity interactions, draft emails via N8N/Outlook"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
cold-email = "cold_email_skill.main:main"
